<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FIFA Lineup Manager — Offline (Pop)</title>
<style>
:root{
  --bg:#0a0f1a;--fg:#e6edf3;--card:#121826;--mut:#0f1624;--br:#273449;--ink:#1d2a3f;--pri:#4f8cff;--line:#9fb3c8;
  --tok-min:46px;--tok-max:92px;
  /* ruolo → colore */
  --role-GK:#24a148;
  --role-DF:#0f62fe;
  --role-MF:#8a3ffc;
  --role-FW:#fa4d56;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,Ubuntu,Arial;background:linear-gradient(180deg,#0a0f1a,#090d16);color:var(--fg)}
.container{max-width:1280px;margin:0 auto;padding:12px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.left,.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:10px;overflow:hidden;border:1px solid var(--br);background:#0f1624}
.logo img{width:100%;height:100%;object-fit:cover}
.title{font-weight:800;cursor:pointer}
.sub{font-size:12px;opacity:.8}
.btn{appearance:none;border:1px solid var(--br);background:#1d2a3f;color:var(--fg);padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--pri);color:#0b1020;border-color:transparent}
.input,.select,.textarea{background:#0f1624;color:var(--fg);border:1px solid var(--br);padding:8px 10px;border-radius:10px;font:inherit}
.textarea{min-height:90px;resize:vertical}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,2fr) 380px}}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,.25)}
.pad{padding:10px}

/* CAMPO */
.field{position:relative;width:100%;aspect-ratio:9/16;border-radius:18px;overflow:hidden;border:1px solid var(--br);background:linear-gradient(180deg,#166534,#064e3b)}
.field svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}

/* SLOT + TOKEN */
.slot{position:absolute;transform:translate(-50%,-50%);z-index:1}
.role-badge{position:absolute;top:calc(var(--tok,56px)*-0.42);left:50%;transform:translateX(-50%);
  background:#0b1220;border:1px solid #334155;color:#e2e8f0;font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.token{
  --tok:56px;
  --role-color:var(--role-DF);
  position:relative;width:var(--tok);height:var(--tok);border-radius:999px;
  display:grid;place-content:center;font-weight:900;touch-action:none; -webkit-tap-highlight-color:transparent;
  background:
    linear-gradient(#1113,#1113) padding-box,
    conic-gradient(#fff0 0 25%,#fff3 0 50%,#fff0 0 75%,#fff3 0 100%) border-box,
    var(--role-color) border-box;
  border:3px solid transparent;
  color:var(--token-fg,#e5e7eb);
  box-shadow:
    0 14px 38px rgba(0,0,0,.55),
    0 0 0 1px rgba(0,0,0,.25) inset;
  transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
}
.token::before{ /* anello interno */
  content:""; position:absolute; inset:3px; border-radius:999px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.06), inset 0 12px 22px rgba(0,0,0,.35);
  pointer-events:none;
}
.token::after{ /* sheen in hover */
  content:""; position:absolute; inset:0; border-radius:999px; opacity:.0;
  background:linear-gradient(225deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%);
  transition:opacity .12s ease;
}
.token:hover{transform:scale(1.06); box-shadow:0 18px 44px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.28) inset}
.token:hover::after{opacity:.5}

/* foto + nome */
.token img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:999px;z-index:0}
.token.has-photo .token__name{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);background:rgba(11,18,32,.85);padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.12)}
.token__name{position:relative;z-index:2;max-width:calc(var(--tok)*.95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;line-height:1;font-size:clamp(12px,2.2vw,18px);-webkit-text-stroke:0.6px rgba(0,0,0,.5);text-shadow:0 1px 2px rgba(0,0,0,.45)}

/* numero maglia */
.num{
  position:absolute; right:calc(var(--tok)*-.10); bottom:calc(var(--tok)*-.10);
  min-width:calc(var(--tok)*.34); height:calc(var(--tok)*.34);
  border-radius:999px; display:grid; place-content:center;
  background:#0b1220; color:#e5e7eb; font-weight:900; font-size:calc(var(--tok)*.18);
  border:2px solid #334155; z-index:3;
}

/* LISTE */
.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;background:#0b1220;color:#e2e8f0;margin-bottom:4px}
.list .group{border:1px solid var(--br);border-radius:12px;padding:10px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--br);border-radius:10px;padding:8px}
.row+.row{margin-top:8px}
.av{width:28px;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--br);background:#253046}

/* MODAL + MENU + TOAST */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:50;padding:12px}
.modal.open{display:flex}
.panel{width:min(720px,95vw);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px}
.menu-pop{position:fixed;min-width:240px;max-width:320px;max-height:280px;overflow:auto;background:var(--card);border:1px solid var(--br);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:6px;z-index:70}
.menu-item{display:flex;gap:8px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.menu-item:hover{background:#1d2a3f}
.menu-head{font-weight:800;padding:6px 8px;opacity:.9}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;background:#0b1220;color:#e5e7eb;border:1px solid #273449;padding:8px 12px;border-radius:10px;font-size:12px;display:none;z-index:90}
.toast.show{display:block}
.switch{display:inline-flex;align-items:center;gap:6px}
/* Touch helpers */
.field.unlocked{touch-action:none}
body.no-scroll{overflow:hidden}
</style>
</head>
<body>
<div class="container">
  <div class="toolbar">
    <div class="left">
      <div class="logo" id="logoBox"></div>
      <div>
        <div class="title" id="teamName">FC Champions</div>
        <div class="sub" id="coach">Allenatore: Marco Rossi</div>
      </div>
    </div>
    <div class="right">
      <label class="btn">Logo<input id="logoInput" type="file" accept="image/*" style="display:none"></label>
      <button class="btn" id="editInfo">Modifica</button>
      <button class="btn" id="editRoles">Ruoli</button>
      <button class="btn" id="share">Condividi</button>
      <button class="btn" id="lock">Sblocca movimento</button>
      <label class="switch"><input id="snap" type="checkbox" checked>Snap</label>
      <label class="switch"><input id="anticoll" type="checkbox" checked>Anti-collisione</label>
      <button class="btn" id="reset">Reset pos</button>
      <button class="btn primary" id="downloadHtml">Scarica HTML</button>
    </div>
  </div>

  <div class="cols">
    <div class="card pad">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px">
        <div style="display:flex;gap:8px;align-items:center">
          <span style="opacity:.8">Formazione</span>
          <select id="formation" class="select"><option>4-2-1-3</option><option>4-3-3</option><option>4-4-2</option></select>
        </div>
        <button class="btn" id="add">Aggiungi giocatore</button>
      </div>
      <div class="field" id="field">
        <svg viewBox="0 0 100 160" preserveAspectRatio="none">
          <g stroke="var(--line)" stroke-width=".6" fill="none" opacity=".9">
            <rect x="2.5" y="2.5" width="95" height="155" rx="2.5"/>
            <line x1="2.5" y1="80" x2="97.5" y2="80"/>
            <circle cx="50" cy="80" r="9"/>
            <rect x="32" y="132" width="36" height="18"/>
            <rect x="40" y="142" width="20" height="8"/>
            <rect x="32" y="10" width="36" height="18"/>
            <rect x="40" y="10" width="20" height="8"/>
            <rect x="46.5" y="150" width="7" height="4"/>
            <rect x="46.5" y="6" width="7" height="4"/>
            <line x1="8" y1="30" x2="92" y2="30" opacity=".6" stroke-width=".4"/>
            <line x1="8" y1="55" x2="92" y2="55" opacity=".6" stroke-width=".4"/>
            <line x1="8" y1="105" x2="92" y2="105" opacity=".6" stroke-width=".4"/>
            <line x1="8" y1="130" x2="92" y2="130" opacity=".6" stroke-width=".4"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="card pad">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" class="input" placeholder="Cerca giocatore">
      </div>
      <div id="list" class="list" style="max-height:60vh;overflow:auto"></div>
    </div>
  </div>
</div>

<!-- Modals -->
<div class="modal" id="infoM"><div class="panel">
  <h3 style="margin:0 0 8px">Info squadra</h3>
  <div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div><label style="font-size:12px">Nome squadra</label><input id="tNameI" class="input" placeholder="Inserisci nome"></div>
    <div><label style="font-size:12px">Allenatore</label><input id="coachI" class="input" placeholder="Nome allenatore"></div>
  </div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px"><button class="btn" data-close="#infoM">Chiudi</button></div>
</div></div>

<div class="modal" id="rolesM"><div class="panel">
  <h3 style="margin:0 0 8px">Etichette ruoli</h3>
  <div id="rolesEditBox" style="display:grid;grid-template-columns:1fr;gap:8px"></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
    <button class="btn" data-close="#rolesM">Annulla</button>
    <button class="btn primary" id="rolesSave">Salva</button>
  </div>
</div></div>

<div class="modal" id="roleLabelM"><div class="panel">
  <h3 style="margin:0 0 8px">Etichetta ruolo</h3>
  <input id="roleLabelInput" class="input" placeholder="Nome ruolo">
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
    <button class="btn" data-close="#roleLabelM">Annulla</button>
    <button class="btn primary" id="roleLabelSave">Salva</button>
  </div>
</div></div>

<div class="modal" id="playerM"><div class="panel">
  <h3 id="pTitle" style="margin:0 0 8px">Nuovo Giocatore</h3>
  <div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div>
      <label style="font-size:12px">Nome</label><input id="pName" class="input" placeholder="Nome e cognome">
      <label style="font-size:12px;margin-top:8px;display:block">Ruolo</label><select id="pRole" class="select"></select>
      <label style="font-size:12px;margin-top:8px;display:block">Numero</label><select id="pNum" class="select"></select>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" id="pAbs"><label for="pAbs" style="font-size:12px">Assente</label></div>
    </div>
    <div>
      <label style="font-size:12px">Foto</label>
      <div style="display:flex;gap:8px;align-items:center"><input id="pPhoto" type="file" accept="image/*" class="input"><button class="btn" id="pDelPhoto">Rimuovi</button></div>
      <div id="pPrev" style="margin-top:8px;width:110px;height:110px;border:1px solid var(--br);border-radius:12px;display:grid;place-content:center;opacity:.7;overflow:hidden"></div>
      <label style="font-size:12px;display:block;margin-top:8px">Note</label><textarea id="pNotes" class="textarea" placeholder="Note"></textarea>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;gap:8px;margin-top:10px">
    <button class="btn" id="pRemove" style="display:none">Elimina</button>
    <div style="display:flex;gap:8px">
      <button class="btn" data-close="#playerM">Annulla</button>
      <button class="btn primary" id="pSave">Salva</button>
    </div>
  </div>
</div></div>

<div class="modal" id="shareM"><div class="panel">
  <h3 style="margin:0 0 8px">Condividi formazione</h3>
  <div class="grid" style="display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px">
    <input id="shareInfo" class="input" readonly value="Scarica un HTML auto-contenuto (offline)">
    <button class="btn primary" id="dlHtml">Scarica HTML</button>
  </div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px"><button class="btn" data-close="#shareM">Chiudi</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ===== ROLES & FORMATIONS ===== */
const rolesConfig={
  POR:{group:'GK',defaultLabel:'Portiere',color:'var(--role-GK)',hex:'#24a148',icon:'🧤'},
  DC:{group:'DF',defaultLabel:'Difensore Centrale',color:'var(--role-DF)',hex:'#0f62fe',icon:'🛡️'},
  TS:{group:'DF',defaultLabel:'Terzino',color:'var(--role-DF)',hex:'#0f62fe',icon:'🛡️'},
  TD:{group:'DF',defaultLabel:'Terzino',color:'var(--role-DF)',hex:'#0f62fe',icon:'🛡️'},
  CDS:{group:'MF',defaultLabel:'Centrocampista Difensivo',color:'var(--role-MF)',hex:'#8a3ffc',icon:'⚙️'},
  COC:{group:'MF',defaultLabel:'Centrocampista Offensivo',color:'var(--role-MF)',hex:'#8a3ffc',icon:'⚙️'},
  AS:{group:'FW',defaultLabel:'Ala',color:'var(--role-FW)',hex:'#fa4d56',icon:'🎯'},
  ATT:{group:'FW',defaultLabel:'Attaccante',color:'var(--role-FW)',hex:'#fa4d56',icon:'🎯'},
  AD:{group:'FW',defaultLabel:'Ala',color:'var(--role-FW)',hex:'#fa4d56',icon:'🎯'}
};
const roleCodes=Object.keys(rolesConfig);
const FORMATIONS={
  '4-2-1-3':[ {id:'ATT',role:'ATT',x:50,y:14},{id:'AS',role:'AS',x:25,y:22},{id:'AD',role:'AD',x:75,y:22},
              {id:'COC',role:'COC',x:50,y:36},{id:'CDS_L',role:'CDS',x:40,y:52},{id:'CDS_R',role:'CDS',x:60,y:52},
              {id:'TS',role:'TS',x:18,y:78},{id:'DC1',role:'DC',x:42,y:78},{id:'DC2',role:'DC',x:58,y:78},{id:'TD',role:'TD',x:82,y:78},
              {id:'POR',role:'POR',x:50,y:92} ],
  '4-3-3':[   {id:'ATT',role:'ATT',x:50,y:16},{id:'AS',role:'AS',x:24,y:24},{id:'AD',role:'AD',x:76,y:24},
              {id:'COC',role:'COC',x:38,y:46},{id:'CDS_L',role:'CDS',x:50,y:56},{id:'CDS_R',role:'CDS',x:62,y:46},
              {id:'TS',role:'TS',x:18,y:78},{id:'DC1',role:'DC',x:42,y:78},{id:'DC2',role:'DC',x:58,y:78},{id:'TD',role:'TD',x:82,y:78},
              {id:'POR',role:'POR',x:50,y:92} ],
  '4-4-2':[   {id:'ATT1',role:'ATT',x:43,y:18},{id:'ATT2',role:'ATT',x:57,y:18},
              {id:'AS',role:'AS',x:22,y:46},{id:'CDS_L',role:'CDS',x:45,y:52},
              {id:'CDS_R',role:'CDS',x:55,y:52},{id:'AD',role:'AD',x:78,y:46},
              {id:'TS',role:'TS',x:18,y:78},{id:'DC1',role:'DC',x:42,y:78},{id:'DC2',role:'DC',x:58,y:78},{id:'TD',role:'TD',x:82,y:78},
              {id:'POR',role:'POR',x:50,y:92} ]
};
function roleLabel(code){return Storage.get('roleName_'+code, rolesConfig[code].defaultLabel)}
function setRoleLabel(code,label){Storage.set('roleName_'+code,label)}

/* ===== STORAGE WRAPPER ===== */
const Mem={};
const Storage={
  get:(k,def)=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):def}catch(_){try{const t=sessionStorage.getItem(k);return t?JSON.parse(t):Mem[k]??def}catch(_){return Mem[k]??def}}},
  set:(k,v)=>{const s=JSON.stringify(v);try{ if(s.length>4_500_000) throw new Error('too_large'); localStorage.setItem(k,s); return true; }
              catch(_){ try{sessionStorage.setItem(k,s)}catch(_){} Mem[k]=v; notify("Spazio locale insufficiente: salvato in sessione."); return false; } }
};

/* ===== STATE ===== */
let formationKey=Storage.get('formationKey','4-2-1-3');
let players=Storage.get('players',[]);
let lineup=Storage.get('lineup',{});
let teamName=Storage.get('teamName','FC Champions');
let coachName=Storage.get('coachName','Marco Rossi');
let logo=Storage.get('logo','');
let posOverrides=Storage.get('posOverrides',{});
let moveLocked=Storage.get('moveLocked',true);
let snap=Storage.get('snap',true);
let anticoll=Storage.get('anticoll',true);
let __editing=null, __pendingPos=null, __roleEditing=null;

/* Seed 11 giocatori se primo avvio */
if(players.length===0){
  const mk=(n,r,num)=>({id:crypto.randomUUID(),name:n,role:r,number:String(num),photo:'',absent:false,notes:'',createdAt:Date.now()});
  players=[mk('G. Doni','POR',1),mk('L. Bianchi','DC',4),mk('A. Neri','DC',5),mk('M. Verdi','TS',3),mk('S. Rossi','TD',2),
           mk('P. Gallo','CDS',6),mk('D. Bruni','CDS',8),mk('N. Corsi','COC',10),mk('F. Mancini','AS',11),mk('R. Serra','AD',7),mk('E. Vitale','ATT',9)];
  lineup={ATT:players.find(p=>p.role==='ATT').id, AS:players.find(p=>p.role==='AS').id, AD:players.find(p=>p.role==='AD').id,
          COC:players.find(p=>p.role==='COC').id, CDS_L:players.filter(p=>p.role==='CDS')[0].id, CDS_R:players.filter(p=>p.role==='CDS')[1].id,
          TS:players.find(p=>p.role==='TS').id, DC1:players.filter(p=>p.role==='DC')[0].id, DC2:players.filter(p=>p.role==='DC')[1].id,
          TD:players.find(p=>p.role==='TD').id, POR:players.find(p=>p.role==='POR').id };
  Storage.set('players',players); Storage.set('lineup',lineup);
}

/* ===== UTILS ===== */
const byId=(id)=>document.getElementById(id);
function notify(msg){const t=byId('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(notify._t); notify._t=setTimeout(()=>t.classList.remove('show'),2200)}
function fileToDataUrlResized(file,maxSide=640,quality=0.85){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{ const img=new Image(); img.onload=()=>{
        const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        try{ resolve(c.toDataURL('image/jpeg',quality)) } catch(_){ resolve(r.result) }
      }; img.onerror=reject; img.src=r.result };
    r.onerror=reject; r.readAsDataURL(file);
  });
}
function updateTok(){const f=byId('field'); if(!f) return; const r=f.getBoundingClientRect(); const s=Math.max(56,Math.min(100,Math.round(Math.min(r.width,r.height)*.09))); f.style.setProperty('--tok',s+'px')}
function oKey(f,p){return `${f}:${p}`}
function getXY(f,pos){const ov=posOverrides[oKey(f,pos.id)]; return {x:ov?ov.x:pos.x, y:ov?ov.y:pos.y}}
function isDark(hex){const c=hex.replace('#','');const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);return(0.299*r+0.587*g+0.114*b)/255<0.5}

function syncFieldTouch(){ const fld=byId('field'); if(!fld) return; fld.classList.toggle('unlocked', !moveLocked); }
/* ===== RENDER ===== */
function renderHeader(){
  byId('teamName').textContent=teamName;
  byId('coach').textContent='Allenatore: '+(coachName||'—');
  byId('logoBox').innerHTML=logo?`<img src="${logo}" alt="logo">`:'';
  byId('lock').textContent=moveLocked?'Sblocca movimento':'Blocca movimento';
  byId('snap').checked=!!snap; byId('anticoll').checked=!!anticoll;
  syncFieldTouch();
}
function renderField(){
  const f=byId('field'); f.querySelectorAll('.slot').forEach(n=>n.remove()); updateTok();
  (FORMATIONS[formationKey]||[]).forEach(pos=>{
    const slot=document.createElement('div'); slot.className='slot';
    const xy=getXY(formationKey,pos); slot.style.left=xy.x+'%'; slot.style.top=xy.y+'%';
    const pl=players.find(p=>p.id===lineup[pos.id]);
    /* badge ruolo */
    const cfg=rolesConfig[pos.role];
    const rb=document.createElement('div'); rb.className='role-badge';
    const rl=roleLabel(pos.role); rb.textContent=rl; rb.style.background=cfg.color; rb.style.color=isDark(cfg.hex)?'#e5e7eb':'#0b1020'; slot.appendChild(rb);
    /* token */
    const t=document.createElement('button'); t.type='button'; t.className='token';
    t.style.setProperty('--role-color',cfg.color);
    t.style.setProperty('--token-fg',isDark(cfg.hex)?'#e5e7eb':'#0b1020');
    if(pl && pl.photo){ const im=new Image(); im.src=pl.photo; t.appendChild(im); t.classList.add('has-photo'); }
    const nm=document.createElement('div'); nm.className='token__name'; nm.textContent=pl?pl.name:rl; nm.title=nm.textContent; t.appendChild(nm);
    if(pl && pl.number && pl.number!=='none'){ const nb=document.createElement('div'); nb.className='num'; nb.textContent=pl.number; t.appendChild(nb); }

const openIfNotDragged=(ev)=>{ if(t.__dragged){ ev.preventDefault(); ev.stopPropagation(); t.__dragged=false; return; } showRoleMenu(pos,pl,t); };
t.addEventListener('pointerup', openIfNotDragged, {passive:false});
if(!moveLocked) enableDrag(t,slot,pos.id);
    slot.appendChild(t); f.appendChild(slot);
  });
}
function firstFree(role){const ids=(FORMATIONS[formationKey]||[]).filter(p=>p.role===role).map(p=>p.id); for(const id of ids){ if(!lineup[id]) return id } return ids[0] }

  if(window.__menu){window.__menu.remove(); window.__menu=null;}

  editLabel.onclick=()=>{ m.remove(); openRoleLabelEditor(pos.role); }; m.appendChild(editLabel);
  if(player){
    const rem=document.createElement('div'); rem.className='menu-item'; rem.textContent='Rimuovi da posizione';
    rem.onclick=()=>{ delete lineup[pos.id]; Storage.set('lineup',lineup); m.remove(); renderField(); };
    m.appendChild(rem);
    const ed=document.createElement('div'); ed.className='menu-item'; ed.textContent='Modifica giocatore';
    ed.onclick=()=>{ m.remove(); openPlayer(player); }; m.appendChild(ed);
  }
  const list=players.filter(p=>p.role===pos.role);
  if(list.length){
    const s=document.createElement('div'); s.className='menu-head'; s.textContent='Gerarchia'; m.appendChild(s);
    list.forEach((p,i)=>{
      const it=document.createElement('div'); it.className='menu-item';
      it.innerHTML=`<div class="av" style="width:24px;height:24px;border-radius:999px;overflow:hidden">${p.photo?`<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover">`:''}</div>
                    <div><div>${p.name}</div><div style="font-size:11px;opacity:.7">#${p.number==='none'?'—':p.number} · Ordine ${i+1}${p.absent?' · Assente':''}</div></div>`;
      it.onclick=()=>{ lineup[pos.id]=p.id; Storage.set('lineup',lineup); m.remove(); renderField(); };
      m.appendChild(it);
    });
  }else{
    const emp=document.createElement('div'); emp.className='menu-item'; emp.style.opacity=.7; emp.textContent='Nessun giocatore per ruolo'; m.appendChild(emp);
  }
  const add=document.createElement('div'); add.className='menu-item'; add.textContent='➕ Nuovo giocatore';
  add.onclick=()=>{ m.remove(); openPlayer(null,pos.id); }; m.appendChild(add);
  document.body.appendChild(m); window.__menu=m;
  const ar=anchor.getBoundingClientRect(); const vw=innerWidth, vh=innerHeight; const mw=m.offsetWidth, mh=m.offsetHeight;
  let left=ar.left+ar.width/2-mw/2; left=Math.max(8,Math.min(vw-mw-8,left));
  let top=ar.bottom+8; if(top+mh>vh-8) top=ar.top-mh-8; top=Math.max(8,top);
  m.style.left=left+'px'; m.style.top=top+'px';
  setTimeout(()=>document.addEventListener('mousedown',function hide(e){ if(m&&!m.contains(e.target)){m.remove(); window.__menu=null; document.removeEventListener('mousedown',hide,true)} },true),0);
}

/* ===== DRAG (Snap/Anti-collisione) ===== */
function enableDrag(token,slot,posId){
  token.style.cursor='grab'; let act=false,pid=null; const fld=byId('field');
  let startX=0,startY=0, moved=false;
  token.addEventListener('pointerdown',e=>{act=true; pid=e.pointerId; moved=false; token.__dragged=false; startX=e.clientX; startY=e.clientY; token.setPointerCapture(pid); token.style.filter='brightness(1.08)'; document.body.classList.add('no-scroll'); e.preventDefault();},{passive:false});
  token.addEventListener('pointermove',e=>{
    if(!act)return; e.preventDefault();
    const dx=Math.abs(e.clientX-startX), dy=Math.abs(e.clientY-startY);
    if(dx>6||dy>6){ moved=true; token.__dragged=true; }
    const r=fld.getBoundingClientRect();
    let x=((e.clientX-r.left)/r.width)*100, y=((e.clientY-r.top)/r.height)*100;
    x=Math.max(4,Math.min(96,x)); y=Math.max(4,Math.min(96,y));
    slot.style.left=x+'%'; slot.style.top=y+'%';
    posOverrides[oKey(formationKey,posId)]={x:+x.toFixed(2),y:+y.toFixed(2)};
  },{passive:false});
  token.addEventListener('pointerup',finish,{passive:false}); token.addEventListener('pointercancel',finish,{passive:false});
  function finish(e){
    if(!act)return; e && e.preventDefault(); act=false; token.style.filter=''; document.body.classList.remove('no-scroll');
    const r=fld.getBoundingClientRect();
    let x=parseFloat(slot.style.left), y=parseFloat(slot.style.top);
    let px=r.left+r.width*(x/100), py=r.top+r.height*(y/100);
    const tok=parseFloat(getComputedStyle(fld).getPropertyValue('--tok'))||56;
    if(snap){
      const step=tok, minX=r.left+r.width*.04, maxX=r.left+r.width*.96, minY=r.top+r.height*.04, maxY=r.top+r.height*.96;
      px=Math.max(minX,Math.min(maxX,Math.round((px-r.left)/step)*step+r.left));
      py=Math.max(minY,Math.min(maxY,Math.round((py-r.top)/step)*step+r.top));
    }
    if(anticoll){
      const others=[]; (FORMATIONS[formationKey]||[]).forEach(p=>{
        if(p.id===posId)return; const xy=getXY(formationKey,p),ox=r.left+r.width*(xy.x/100),oy=r.top+r.height*(xy.y/100); others.push({x:ox,y:oy});
      });
      const minD=tok*1.05; const coll=(X,Y)=>others.some(q=>Math.hypot(X-q.x,Y-q.y)<minD);
      if(coll(px,py)){
        const step=tok, minX=r.left+r.width*.04, maxX=r.left+r.width*.96, minY=r.top+r.height*.04, maxY=r.top+r.height*.96;
        let best=null;
        for(let lay=1;lay<=6&&!best;lay++){
          for(let dx=-lay;dx<=lay&&!best;dx++){
            for(let dy=-lay;dy<=lay&&!best;dy++){
              if(Math.abs(dx)!==lay&&Math.abs(dy)!==lay)continue;
              const cx=Math.max(minX,Math.min(maxX,px+dx*step)), cy=Math.max(minY,Math.min(maxY,py+dy*step));
              if(!coll(cx,cy)) best={x:cx,y:cy};
            }
          }
        }
        if(best){ px=best.x; py=best.y }
      }
    }
    const nx=((px-r.left)/r.width)*100, ny=((py-r.top)/r.height)*100;
    slot.style.left=nx+'%'; slot.style.top=ny+'%';
    posOverrides[oKey(formationKey,posId)]={x:+nx.toFixed(2),y:+ny.toFixed(2)};
    Storage.set('posOverrides',posOverrides);
    setTimeout(()=>{ token.__dragged=false; },50);
  }
}

/* ===== PLAYER MODAL ===== */
function updatePlayerOptions(){
  const roleSel=byId('pRole'); roleSel.innerHTML=roleCodes.map(code=>`<option value="${code}">${roleLabel(code)}</option>`).join('');
  const numSel=byId('pNum'); numSel.innerHTML='<option value="none">Nessun numero</option>'+Array.from({length:99},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
}
function openPlayer(p,posId){
  __editing=p||null; __pendingPos=posId||null; updatePlayerOptions();
  byId('pTitle').textContent=p?'Modifica Giocatore':'Nuovo Giocatore';
  byId('pName').value=p?p.name:''; byId('pRole').value=p?p.role:(__pendingPos?FORMATIONS[formationKey].find(x=>x.id===__pendingPos)?.role:'ATT');
  byId('pNum').value=p?(p.number||'none'):'none'; byId('pAbs').checked=!!(p&&p.absent);
  byId('pNotes').value=p?(p.notes||''):'';
  byId('pPrev').innerHTML=p&&p.photo?`<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover">`:'';
  byId('pRemove').style.display=p?'':'none'; byId('pPhoto').value='';
  openModal('#playerM');
}
async function handlePlayerSave(){
  const name=byId('pName').value.trim(); if(!name){console.error('Nome obbligatorio');return;}
  const role=byId('pRole').value; const num=byId('pNum').value; const abs=byId('pAbs').checked; const notes=byId('pNotes').value; const file=byId('pPhoto').files[0];
  let photo=__editing?(__editing.photo||''):'';
  if(file){ photo=await fileToDataUrlResized(file) }
  if(__editing){ Object.assign(__editing,{name: name, role: role, number: num, absent: abs, notes: notes, photo: photo}); }
  else { const p={id:crypto.randomUUID(),name,role,number:num,absent:abs,notes,photo,createdAt:Date.now()}; players.push(p); if(__pendingPos){ lineup[__pendingPos]=p.id; Storage.set('lineup',lineup) } }
  Storage.set('players',players); renderList(); renderField(); closeModal('#playerM');
}
function handlePlayerDelete(){
  if(!__editing) return; const id=__editing.id;
  Object.keys(lineup).forEach(k=>{ if(lineup[k]===id) delete lineup[k] });
  players=players.filter(p=>p.id!==id);
  Storage.set('players',players); Storage.set('lineup',lineup);
  renderList(); renderField(); closeModal('#playerM');
}
